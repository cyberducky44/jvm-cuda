[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jvmcuda"
version = "0.1.0"
description = "Experimental direct CUDA interpreter for static integer Java bytecode"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
cuda = ["nvidia-cuda-nvrtc-cu12>=12.6,<13"]

[project.scripts]
jvmcuda = "jvmcuda.__main__:main"

[tool.setuptools.packages.find]
include = ["jvmcuda*"]

[tool.setuptools.package-data]
jvmcuda = ["interpreter.cu"]
